[package]
name = "morfpix-engine"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
description = "Image compression and format conversion engine"
authors = ["morfpix Contributors"]
repository = "https://github.com/sampadmahanty/morfpix"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
jxl-oxide = { version = "0.12", features = ["image"] }
mozjpeg-rs = { version = "0.9", default-features = false }
oxideav-avif = "0.0.16"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
qcms = "0.3"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rgb = { version = "0.8", default-features = false }
serde = { version = "1.0", features = ["derive"] }
webp = { version = "0.2", default-features = false }
zune-core = "0.5"
zune-jpegxl = "0.5"

[dev-dependencies]
serde_json = "1"
